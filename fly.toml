# ==============================================================================
# Fly.io configuration for DevUpWard Music Bot
# ==============================================================================

app = 'devupward-music-bot'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  LOG_LEVEL = 'INFO'
  DEFAULT_VOLUME = '50'
  IDLE_TIMEOUT_SECONDS = '300'

# Crucial for Discord Bots: auto_stop_machines = 'off' so Fly never puts the bot to sleep!
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 200
    hard_limit = 250

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '512mb'
