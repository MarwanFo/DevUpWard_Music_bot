# fly.toml app configuration file generated for devupward-music-bot on 2026-11-04T00:49:19Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'devupward-music-bot'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  DEFAULT_VOLUME = '50'
  IDLE_TIMEOUT_SECONDS = '300'
  LOG_LEVEL = 'INFO'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
